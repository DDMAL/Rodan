# kind-config.yml — Kind cluster config for Podman-based local development
#
# Kind runs its node as a container, so Mac hostPaths are not visible inside
# the cluster by default. extraMounts declares which Mac directories to bind
# into the Kind node before the cluster starts.
#
# Prerequisites:
#   brew install podman podman-desktop kind kubectl
#   podman machine init --cpus 4 --memory 6144
#   podman machine start
#
# Create the cluster (run once):
#   export RODAN_SRC=/Users/yourname/path/to/Rodan
#   envsubst < kind-config.yml | kind create cluster --name rodan --config -
#
# Then apply the manifest:
#   kubectl apply -f kubernetes-podman.yml
#
# Teardown:
#   kind delete cluster --name rodan

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
    extraMounts:
      # rodan-main source code (mounted into rodan-main, celery, py3-celery, gpu-celery)
      - hostPath: ${RODAN_SRC}/rodan-main/code
        containerPath: /mnt/rodan-code
      # rodan-client source code
      - hostPath: ${RODAN_SRC}/rodan-client/code
        containerPath: /mnt/rodan-client-code
