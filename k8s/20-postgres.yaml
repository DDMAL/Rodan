# Postgres 16 + plpython3. Single instance, PGDATA on the static NFS PVC (pg16_data, restored
# from the old 9.6 dump). The PGDATA is already initialized, so the entrypoint skips initdb and
# the POSTGRES_USER/PASSWORD/DB env are effectively no-ops (kept for first-init).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rodan
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: postgres
          image: ghcr.io/ddmal/postgres-plpython:k8s-migration
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: TZ
              value: "America/Toronto"
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: rodan-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: rodan-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rodan-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: pg-backup
              mountPath: /backups
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: rodan-pg-data
        - name: pg-backup
          persistentVolumeClaim:
            claimName: rodan-pg-backup
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rodan
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres