# Redis: Celery is NOT backed by redis here (broker+backend are RabbitMQ); redis is the
# ws4redis websocket broker + cache. Ephemeral (the current stack persists nothing for redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rodan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: TZ
              value: "America/Toronto"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rodan
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis