# RabbitMQ: Celery broker AND result backend (CELERY_RESULT_BACKEND="amqp" in settings.py).
# Ephemeral storage matches the current stack (rabbitmq durability is a known upstream TODO).
# DEFAULT_USER/PASS must match the credentials embedded in rodan-secrets/RABBITMQ_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: rodan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:alpine
          ports:
            - containerPort: 5672
              name: amqp
          env:
            - name: TZ
              value: "America/Toronto"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: rodan-secrets, key: RABBITMQ_DEFAULT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: rodan-secrets, key: RABBITMQ_DEFAULT_PASS } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rodan
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp