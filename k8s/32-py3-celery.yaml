# Python3 Celery worker (queue "Python3"). This image's ENTRYPOINT is /run/start-celery
# directly (no /opt/entrypoint wrapper), so no args override is needed. Node "celery@Python3".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: py3-celery
  namespace: rodan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py3-celery
  template:
    metadata:
      labels:
        app: py3-celery
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Pinned to Rodan's GPU node for memory headroom (see 31-celery.yaml). No nvidia
      # RuntimeClass: CPU-only worker.
      nodeSelector:
        kubernetes.io/hostname: k3s-gpu-node-2
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: py3-celery
          image: ghcr.io/ddmal/rodan-python3-celery:nightly
          envFrom:
            - configMapRef: { name: rodan-config }
            - secretRef: { name: rodan-secrets }
          env:
            - name: CELERY_JOB_QUEUE
              value: "Python3"
          volumeMounts:
            - name: resources
              mountPath: /rodan/data
          startupProbe:
            exec:
              command: ["celery", "-A", "rodan", "--workdir", "/code/Rodan", "inspect", "ping", "-d", "celery@Python3", "-t", "30"]
            periodSeconds: 45
            timeoutSeconds: 40        # default probe timeout is 1s; celery inspect ping needs far longer
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["celery", "-A", "rodan", "--workdir", "/code/Rodan", "inspect", "ping", "-d", "celery@Python3", "-t", "30"]
            periodSeconds: 60
            timeoutSeconds: 45
            failureThreshold: 3
          # Idle ~0.3Gi; heaviest jobs measured: Non-Interactive Classifier 2.2 GB, Sauvola 1.6 GB.
          # Limit covers 3 heavy jobs at once (concurrency=3).
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: rodan-resources
