# Backbone.js static client (nginx :80 inside the image). Its runtime configuration.json is
# injected via ConfigMap (the compose stack bind-mounts it at /client/configuration.json).
# Public access is https via the edge, so SERVER_HTTPS=true / port 443 / host rodan2.simssa.ca.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rodan-client-config
  namespace: rodan
data:
  configuration.json: |
    {
        "SERVER_HOST": "rodan2.simssa.ca",
        "SERVER_PORT": "443",
        "SERVER_HTTPS": true,
        "SERVER_SOCKET_AVAILABLE": false,
        "SERVER_AUTHENTICATION_TYPE": "token",
        "ADMIN_CLIENT": {
            "NAME": "",
            "EMAIL": ""
        },
        "DEBUG": false,
        "WORKFLOWBUILDERGUI": {
            "USER_AGENT": "rodan-standard",
            "GRID": {
                "DIMENSION": 20,
                "LINE_COLOR": "#606060",
                "LINE_WIDTH": 0.5
            },
            "ZOOM_MAX": 3.0,
            "ZOOM_MIN": 1.0,
            "ZOOM_RATE": 0.05,
            "ZOOM_INITIAL": 1.7,
            "WORKFLOWJOB_WIDTH": 20,
            "WORKFLOWJOB_HEIGHT": 22,
            "PORT_WIDTH": 8,
            "PORT_HEIGHT": 8,
            "OUTPUTPORT_COLOR": "#00ff00",
            "INPUTPORT_COLOR_SATISFIED": "#00ff00",
            "INPUTPORT_COLOR_UNSATISFIED": "#ff0000",
            "INPUTPORT_COLOR_CANDIDATE": "#00ff00",
            "STROKE_COLOR": "#000000",
            "FILL_COLOR": "#ccccff",
            "WORKFLOWJOBGROUP_FILL_COLOR": "#8888ff",
            "STROKE_WIDTH": 1,
            "FONT_SIZE": 10,
            "STROKE_COLOR_SELECTED": "#0000ff",
            "STROKE_WIDTH_SELECTED": 2,
            "CONNECTION_CIRCLE_RADIUS": 4,
            "HOVER_TIME": 1000
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rodan-client
  namespace: rodan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rodan-client
  template:
    metadata:
      labels:
        app: rodan-client
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: rodan-client
          image: ghcr.io/ddmal/rodan-client:modernize-backend-py311
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: client-config
              mountPath: /client/configuration.json
              subPath: configuration.json
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: client-config
          configMap:
            name: rodan-client-config
---
apiVersion: v1
kind: Service
metadata:
  name: rodan-client
  namespace: rodan
spec:
  selector:
    app: rodan-client
  ports:
    - port: 80
      targetPort: 80
      name: http
