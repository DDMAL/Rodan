# Default Celery worker (queue "celery"). Same image as the API; ENTRYPOINT /opt/entrypoint
# (waits for pg+redis), then /run/start-celery which also waits for rodan-main:8000 before
# launching the worker as node "celery@celery".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: rodan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Pinned to Rodan's GPU node for its memory headroom (68 GiB): create_diva on a p99
      # (~120 Mpx) image peaks ~3.3 GB and 3 concurrent p90 images ~6.2 GB, more than the shared
      # nodes have free. Tolerates the GPU taint but does NOT use the nvidia RuntimeClass, so
      # gpu-celery stays the only GPU consumer on the node.
      nodeSelector:
        kubernetes.io/hostname: k3s-gpu-node-2
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: celery
          image: ghcr.io/ddmal/rodan-main:nightly
          args: ["/run/start-celery"]
          envFrom:
            - configMapRef: { name: rodan-config }
            - secretRef: { name: rodan-secrets }
          env:
            - name: CELERY_JOB_QUEUE
              value: "celery"
          volumeMounts:
            - name: resources
              mountPath: /rodan/data
          startupProbe:
            exec:
              command: ["celery", "-A", "rodan", "--workdir", "/code/Rodan", "inspect", "ping", "-d", "celery@celery", "-t", "30"]
            periodSeconds: 45
            timeoutSeconds: 40        # default probe timeout is 1s; celery inspect ping needs far longer
            failureThreshold: 30      # tolerates the long wait-for rodan-main:8000 (up to 900s)
          livenessProbe:
            exec:
              command: ["celery", "-A", "rodan", "--workdir", "/code/Rodan", "inspect", "ping", "-d", "celery@celery", "-t", "30"]
            periodSeconds: 60
            timeoutSeconds: 45
            failureThreshold: 3
          # Idle ~0.4Gi; limit covers 3 concurrent large create_diva conversions (concurrency=3).
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "10Gi"
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: rodan-resources
