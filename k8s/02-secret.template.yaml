# TEMPLATE ONLY — do NOT commit real values.
# Copy to 02-secret.yaml, fill in real values, and apply that (02-secret.yaml is gitignored).
# stringData lets you paste plaintext; Kubernetes base64-encodes it on apply.
#
# NOTE: scripts/start reads ADMIN_PASS (the live production.env's ADMIN_PASSWORD is a bug — use ADMIN_PASS here).
# RABBITMQ_URL host/creds must match the rabbitmq Deployment's RABBITMQ_DEFAULT_USER/PASS:
#   amqp://<user>:<pass>@rabbitmq:5672//
apiVersion: v1
kind: Secret
metadata:
  name: rodan-secrets
  namespace: rodan
type: Opaque
stringData:
  # --- Django ---
  DJANGO_SECRET_KEY: "CHANGE_ME_long_random_string"

  # --- Postgres credentials ---
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"

  # --- RabbitMQ (broker URL + the credentials the broker is created with) ---
  RABBITMQ_URL: "amqp://CHANGE_ME_user:CHANGE_ME_pass@rabbitmq:5672//"
  RABBITMQ_DEFAULT_USER: "CHANGE_ME_user"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME_pass"

  # --- Bootstrap superuser (created by scripts/start on first boot) ---
  ADMIN_USER: "CHANGE_ME"
  ADMIN_EMAIL: "admin@rodan2.simssa.ca"
  ADMIN_PASS: "CHANGE_ME"

  # --- SMTP (optional; leave blank to fall back to console email backend) ---
  EMAIL_HOST: ""
  EMAIL_PORT: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""